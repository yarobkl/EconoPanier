name: EconoPanier
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  EconoPanier:
    type: application
    platform: iOS
    sources: [App, Core, Features]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.yaroconsulting.econopanier
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ÉconoPanier
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
  EconoPanierTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: EconoPanier
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.yaroconsulting.econopanier.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  EconoPanier:
    build:
      targets:
        EconoPanier: all
    test:
      targets: [EconoPanierTests]
