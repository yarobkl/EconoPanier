name: iOS — validation cloud
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-foundations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator-tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier Xcode et générer le projet
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          command -v xcodegen || brew install xcodegen
          xcodegen --version
          xcodegen generate
      - name: Choisir un simulateur iPhone disponible
        id: simulator
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          phones=[d for runtime,items in devices.items() if 'iOS' in runtime for d in items if 'iPhone' in d['name'] and d.get('isAvailable',True)]
          if not phones: raise SystemExit('Aucun simulateur iPhone disponible')
          preferred=next((d for d in phones if d['name']=='iPhone 16 Pro'),phones[0])
          print('id='+preferred['udid'])
          PY
      - name: Compiler et tester (simulateur sans signature)
        run: |
          set -o pipefail
          xcodebuild -project EconoPanier.xcodeproj -scheme EconoPanier -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test | tee build.log
      - name: Conserver les preuves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-cloud-evidence
          path: |
            build.log
            TestResults.xcresult
          if-no-files-found: warn
          retention-days: 7
